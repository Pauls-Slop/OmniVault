<!-- Demo build only: a browser window with a sample website and the OmniVault toolbar popup. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OmniVault demo</title>
<link rel="icon" href="src/icons/icon.svg" type="image/svg+xml">
<style>
  :root {
    --chrome: #e9e9ee; --chrome-2: #f7f7fa; --field: #fff; --ink: #2b2a33; --muted: #6b6a75; --line: #cfcfd8;
    --pressed: #d5d5de; --page: #f5f7fa; color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --chrome: #2b2a33; --chrome-2: #1c1b22; --field: #42414d; --ink: #fbfbfe; --muted: #b6b5bf; --line: #4a4955; --pressed: #52515e; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; }
  body { font: 13px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); }
  .window { position: relative; display: flex; flex-direction: column; height: 100%; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--page); }
  .toolbar { display: flex; align-items: center; gap: 4px; padding: 6px 8px; background: var(--chrome); border-bottom: 1px solid var(--line); flex: none; }
  .tb { width: 30px; height: 30px; display: grid; place-items: center; border: 0; border-radius: 6px; background: transparent; color: var(--muted); padding: 0; }
  .tb svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .url { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 6px; background: var(--field); color: var(--ink); white-space: nowrap; overflow: hidden; }
  .url svg { width: 13px; height: 13px; flex: none; fill: none; stroke: var(--muted); stroke-width: 1.8; stroke-linecap: round; }
  .url span { overflow: hidden; text-overflow: ellipsis; }
  .url .host { color: var(--ink); } .url .path { color: var(--muted); }
  #ov-icon { cursor: pointer; }
  #ov-icon:hover, #ov-icon[aria-expanded="true"] { background: var(--pressed); }
  #ov-icon:focus-visible { outline: 2px solid #ff4d9a; outline-offset: 1px; }
  #ov-icon img { width: 18px; height: 18px; display: block; }
  #ov-page { flex: 1; width: 100%; border: 0; display: block; background: var(--page); }
  /* the toolbar popup: fixed 380 × 560 like in the browser, right below the icon */
  .popup { position: absolute; top: 42px; right: 6px; width: 380px; height: 560px; transform-origin: top right;
    border-radius: 8px; overflow: hidden; box-shadow: 0 8px 30px #0000004d, 0 0 0 1px #0000001f; background: #fff; z-index: 2; }
  .popup[hidden] { display: none; }
  .popup iframe { width: 380px; height: 560px; border: 0; display: block; }
  .hint { position: absolute; top: 46px; right: 8px; z-index: 1; max-width: 230px; padding: 8px 10px; border-radius: 8px;
    background: #2b0a17; color: #fff; font-size: 12.5px; box-shadow: 0 4px 14px #0003; }
  .hint::before { content: ""; position: absolute; top: -6px; right: 12px; border: 6px solid transparent; border-top: 0; border-bottom-color: #2b0a17; }
  .hint[hidden] { display: none; }
</style>
</head>
<body>
<div class="window">
  <div class="toolbar">
    <span class="tb" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M10 3L5 8l5 5"/></svg></span>
    <span class="tb" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M6 3l5 5-5 5"/></svg></span>
    <button class="tb" id="reload" type="button" title="Reload the sample page" aria-label="Reload the sample page"><svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5V5h-2.5"/></svg></button>
    <div class="url" aria-label="Address"><svg viewBox="0 0 16 16"><rect x="3.5" y="7" width="9" height="6.5" rx="1.3"/><path d="M5.5 7V5.2a2.5 2.5 0 0 1 5 0V7"/></svg><span><span class="host">www.example.com</span><span class="path">/login</span></span></div>
    <button class="tb" id="ov-icon" type="button" title="OmniVault" aria-label="OmniVault" aria-haspopup="dialog" aria-expanded="true" aria-controls="ov-popup"><img src="src/icons/icon.svg" alt=""></button>
  </div>
  <iframe id="ov-page" src="page.html" title="Sample website example.com"></iframe>
  <div class="popup" id="ov-popup" role="dialog" aria-label="OmniVault">
    <iframe id="ov-frame" src="popup.html" title="OmniVault popup" allow="clipboard-write"></iframe>
  </div>
  <div class="hint" id="hint" hidden>Click the OmniVault icon to open the popup again.</div>
</div>
<script>
  const icon = document.getElementById('ov-icon');
  const popup = document.getElementById('ov-popup');
  const frame = document.getElementById('ov-frame');
  const hint = document.getElementById('hint');

  // Like the browser: the popup is a fresh page every time it opens, and it closes when you click elsewhere.
  function open() {
    frame.src = 'popup.html';
    popup.hidden = false; hint.hidden = true;
    icon.setAttribute('aria-expanded', 'true');
    frame.addEventListener('load', () => frame.focus(), { once: true });
  }
  function close() {
    if (popup.hidden) return;
    popup.hidden = true; hint.hidden = false;
    icon.setAttribute('aria-expanded', 'false');
  }
  icon.addEventListener('click', () => (popup.hidden ? open() : close()));
  document.getElementById('reload').addEventListener('click', () => document.getElementById('ov-page').contentWindow.location.reload());
  // the popup calls window.close() after filling (see src/lib/browser.js of the demo)
  addEventListener('message', (e) => { if (e.origin === location.origin && e.data?.omnivaultDemo === 'close') close(); });
  // clicking into the page closes the popup, as in the browser
  document.getElementById('ov-page').addEventListener('load', (e) => {
    e.target.contentDocument?.addEventListener('pointerdown', close);
  });
  addEventListener('keydown', (e) => { if (e.altKey && e.shiftKey && e.code === 'KeyO') { e.preventDefault(); popup.hidden ? open() : close(); } });

  // narrow windows: scale the fixed-size popup down so it stays whole
  function fit() {
    const s = Math.min(1, (innerWidth - 12) / 380, (innerHeight - 48) / 560);
    popup.style.transform = s < 1 ? `scale(${s})` : '';
  }
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
