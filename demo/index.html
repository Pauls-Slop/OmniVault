<!-- Demo build only: the OmniVault toolbar popup in a browser toolbar, with a sample website behind a button.
     Compact: toolbar + popup. Expanded: a browser window with the sample page and the popup over it.
     Embedded in a page, it tells the parent its mode ({ omnivaultDemo: 'layout', expanded }) so the parent can resize it. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OmniVault demo</title>
<link rel="icon" href="src/icons/icon.svg" type="image/svg+xml">
<style>
  :root {
    --chrome: #e9e9ee; --field: #fff; --ink: #2b2a33; --muted: #6b6a75; --line: #cfcfd8; --pressed: #d5d5de;
    --page: #f5f7fa; --empty: #f0f0f4; color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --chrome: #2b2a33; --field: #42414d; --ink: #fbfbfe; --muted: #b6b5bf; --line: #4a4955; --pressed: #52515e; --empty: #232229; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; }
  body { font: 13px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); }
  .window { position: relative; display: flex; flex-direction: column; height: 100%; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--empty); }
  .toolbar { display: flex; align-items: center; gap: 4px; padding: 6px 8px; background: var(--chrome); border-bottom: 1px solid var(--line); flex: none; }
  .tb { width: 30px; height: 30px; display: grid; place-items: center; border: 0; border-radius: 6px; background: transparent; color: var(--muted); padding: 0; flex: none; }
  .tb svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  button.tb { cursor: pointer; }
  button.tb:hover, button.tb[aria-pressed="true"], button.tb[aria-expanded="true"] { background: var(--pressed); color: var(--ink); }
  button:focus-visible { outline: 2px solid #ff4d9a; outline-offset: 1px; }
  .url { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 6px; background: var(--field); white-space: nowrap; overflow: hidden; }
  .url svg { width: 13px; height: 13px; flex: none; fill: none; stroke: var(--muted); stroke-width: 1.8; stroke-linecap: round; }
  .url span { overflow: hidden; text-overflow: ellipsis; }
  .url .path { color: var(--muted); }
  .site-btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--field); color: var(--ink); font: inherit; cursor: pointer; white-space: nowrap; flex: none; }
  .site-btn:hover { background: var(--pressed); }
  .site-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  #ov-icon img { width: 18px; height: 18px; display: block; }
  .body { position: relative; flex: 1; min-height: 0; }
  #ov-page { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: var(--page); }
  /* compact: the page is loaded but not shown (fillInPage needs it laid out, so it is revealed before filling) */
  .compact #ov-page { visibility: hidden; }
  .compact .nav, .compact .url { display: none; }
  .compact .toolbar { justify-content: flex-end; }
  .compact .site-btn { margin-right: auto; }
  /* the toolbar popup: fixed 380 × 560 like in the browser, right below the icon */
  .popup { position: absolute; top: 4px; right: 5px; width: 380px; height: 560px; transform-origin: top right;
    border-radius: 8px; overflow: hidden; box-shadow: 0 8px 30px #0000004d, 0 0 0 1px #0000001f; background: #fff; z-index: 2; }
  .compact .popup { box-shadow: 0 1px 3px #00000026, 0 0 0 1px #0000001f; }
  .popup[hidden] { display: none; }
  .popup iframe { width: 380px; height: 560px; border: 0; display: block; }
  .closed { position: absolute; top: 14px; right: 10px; max-width: 240px; padding: 9px 11px; border-radius: 8px; background: #2b0a17; color: #fff; font-size: 12.5px; box-shadow: 0 4px 14px #0003; z-index: 1; }
  .closed::before { content: ""; position: absolute; top: -6px; right: 12px; border: 6px solid transparent; border-top: 0; border-bottom-color: #2b0a17; }
  .closed[hidden] { display: none; }
</style>
</head>
<body class="compact">
<div class="window">
  <div class="toolbar">
    <span class="nav tb" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M10 3L5 8l5 5"/></svg></span>
    <span class="nav tb" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M6 3l5 5-5 5"/></svg></span>
    <button class="nav tb" id="reload" type="button" title="Reload the sample page" aria-label="Reload the sample page"><svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5V5h-2.5"/></svg></button>
    <button class="site-btn" id="site" type="button" aria-pressed="false" aria-controls="ov-page">
      <svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M2 6h12"/></svg><span>Show sample website</span>
    </button>
    <div class="url" aria-label="Address"><svg viewBox="0 0 16 16"><rect x="3.5" y="7" width="9" height="6.5" rx="1.3"/><path d="M5.5 7V5.2a2.5 2.5 0 0 1 5 0V7"/></svg><span><span>www.example.com</span><span class="path">/login</span></span></div>
    <button class="tb" id="ov-icon" type="button" title="OmniVault" aria-label="OmniVault" aria-expanded="true" aria-controls="ov-popup"><img src="src/icons/icon.svg" alt=""></button>
  </div>
  <div class="body">
    <iframe id="ov-page" src="page.html" title="Sample website example.com" tabindex="-1"></iframe>
    <div class="popup" id="ov-popup" role="dialog" aria-label="OmniVault">
      <iframe id="ov-frame" src="popup.html" title="OmniVault popup" allow="clipboard-write"></iframe>
    </div>
    <div class="closed" id="closed" hidden>OmniVault is closed. Click its icon to open it again.</div>
  </div>
</div>
<script>
  const body = document.body;
  const icon = document.getElementById('ov-icon');
  const popup = document.getElementById('ov-popup');
  const frame = document.getElementById('ov-frame');
  const page = document.getElementById('ov-page');
  const siteBtn = document.getElementById('site');
  const closed = document.getElementById('closed');
  const embedded = window.parent !== window;

  /* ---------- the popup: shown and hidden only with the toolbar icon ---------- */
  function openPopup() {
    frame.src = 'popup.html'; // a fresh page every time it opens, as in the browser
    popup.hidden = false; closed.hidden = true;
    icon.setAttribute('aria-expanded', 'true');
    frame.addEventListener('load', () => frame.focus(), { once: true });
  }
  function closePopup() {
    popup.hidden = true; closed.hidden = false;
    icon.setAttribute('aria-expanded', 'false');
  }
  icon.addEventListener('click', () => (popup.hidden ? openPopup() : closePopup()));
  addEventListener('keydown', (e) => { if (e.altKey && e.shiftKey && e.code === 'KeyO') { e.preventDefault(); icon.click(); } });

  /* ---------- the sample website: behind a button, revealed when the popup needs it ---------- */
  let expanded = false;
  function setExpanded(on) {
    if (on === expanded) return Promise.resolve();
    expanded = on;
    body.classList.toggle('compact', !on);
    page.tabIndex = on ? 0 : -1;
    siteBtn.setAttribute('aria-pressed', String(on));
    siteBtn.lastElementChild.textContent = on ? 'Hide sample website' : 'Show sample website';
    if (embedded) window.parent.postMessage({ omnivaultDemo: 'layout', expanded: on }, location.origin);
    fit();
    // give the embedding page a moment to resize this frame before anything measures the sample page
    return new Promise((r) => setTimeout(() => requestAnimationFrame(() => requestAnimationFrame(r)), embedded ? 120 : 0));
  }
  siteBtn.addEventListener('click', () => setExpanded(!expanded));
  document.getElementById('reload').addEventListener('click', () => page.contentWindow.location.reload());

  // used by the demo's extension APIs (src/lib/browser.js): filling needs the page on screen
  window.ovDemo = { showPage: () => setExpanded(true) };
  // the toolbar popup closes itself after filling; here it stays open and the page shows what was filled
  addEventListener('message', (e) => { if (e.origin === location.origin && e.data?.omnivaultDemo === 'close') setExpanded(true); });

  /* narrow frames: scale the fixed-size popup down so it stays whole */
  function fit() {
    const s = Math.min(1, (innerWidth - 12) / 380, (innerHeight - 52) / 560);
    popup.style.transform = s < 1 ? `scale(${s})` : '';
  }
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
